name: publish
on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: 1mKbR7qk
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          github-token: ${{ secrets.GITHUB_TOKEN }}